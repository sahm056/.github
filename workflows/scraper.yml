name: SEEK Scraper

on:
  schedule:
    # Runs daily at 20:00 UTC (8:00 AM NZST)
    - cron: '0 20 * * *'
  workflow_dispatch: # Enables manual run button in GitHub UI

jobs:
  run-job-scraper:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install Python libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute scraper script
      - name: Run SEEK Scraper
        env:
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: python main.py

      # Step 5: Save generated Excel as a downloadable GitHub Artifact
      - name: Save Excel Output
        uses: actions/upload-artifact@v4
        with:
          name: SEEK_Job_Tracker
          path: "*.xlsx"
